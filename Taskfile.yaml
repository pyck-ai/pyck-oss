version: "3.47"

output: prefixed

set: [errexit, nounset, pipefail]

includes:
  _: { internal: true, taskfile: ./task/_lib.yaml, flatten: true }
  container: { internal: true, taskfile: ./task/container.yaml }
  # optional: the public mirror strips .github/ (see .publicignore)
  github: { taskfile: ./.github/Taskfile.yaml, flatten: true, optional: true }

  bootstrap:
    {
      internal: true,
      taskfile: ./backend/bootstrap/Taskfile.yaml,
      dir: ./backend/bootstrap,
    }
  common:
    {
      internal: true,
      taskfile: ./backend/common/Taskfile.yaml,
      dir: ./backend/common,
    }
  file:
    {
      internal: true,
      taskfile: ./backend/file/Taskfile.yaml,
      dir: ./backend/file,
    }
  gateway:
    {
      internal: true,
      taskfile: ./backend/gateway/Taskfile.yaml,
      dir: ./backend/gateway,
    }
  inventory:
    {
      internal: true,
      taskfile: ./backend/inventory/Taskfile.yaml,
      dir: ./backend/inventory,
    }
  main-data:
    {
      internal: true,
      taskfile: ./backend/main-data/Taskfile.yaml,
      dir: ./backend/main-data,
    }
  management:
    {
      internal: true,
      taskfile: ./backend/management/Taskfile.yaml,
      dir: ./backend/management,
    }
  picking:
    {
      internal: true,
      taskfile: ./backend/picking/Taskfile.yaml,
      dir: ./backend/picking,
    }
  receiving:
    {
      internal: true,
      taskfile: ./backend/receiving/Taskfile.yaml,
      dir: ./backend/receiving,
    }
  temporal:
    {
      internal: true,
      taskfile: ./backend/temporal/Taskfile.yaml,
      dir: ./backend/temporal,
    }
  workflow:
    {
      internal: true,
      taskfile: ./backend/workflow/Taskfile.yaml,
      dir: ./backend/workflow,
    }
  workflowsdk:
    {
      internal: true,
      taskfile: ./backend/workflowsdk/Taskfile.yaml,
      dir: ./backend/workflowsdk,
    }
  integration:
    {
      internal: true,
      taskfile: ./tests/integration/Taskfile.yaml,
      dir: ./tests/integration,
    }
  nats-e2e:
    {
      internal: true,
      taskfile: ./tests/nats/Taskfile.yaml,
      dir: ./tests/nats,
    }

vars:
  # Services `up` and `up:integration` bring up (defined once, used by both).
  UP_SERVICES: management inventory main-data picking receiving workflow gateway file

tasks:
  default:
    aliases: [help]
    cmds:
      - task: ci-ready

  clean:
    desc: Clean all modules
    deps:
      - task: common:{{.TASK}}
      - task: file:{{.TASK}}
      - task: inventory:{{.TASK}}
      - task: main-data:{{.TASK}}
      - task: management:{{.TASK}}
      - task: picking:{{.TASK}}
      - task: receiving:{{.TASK}}
      - task: temporal:{{.TASK}}
      - task: workflow:{{.TASK}}
      - task: gateway:{{.TASK}}
      - task: workflowsdk:{{.TASK}}

  tidy:
    desc: Tidy go.mod/go.sum for every workspace module (keeps modules consistent across the monorepo)
    cmds:
      - ./scripts/tidy-workspace.sh

  generate:
    desc: Generate all modules
    deps:
      - task: clean
    cmds:
      - task: common:{{.TASK}}
      - task: management:{{.TASK}}
      - task: file:{{.TASK}}
      - task: inventory:{{.TASK}}
      - task: main-data:{{.TASK}}
      - task: picking:{{.TASK}}
      - task: receiving:{{.TASK}}
      - task: workflow:{{.TASK}}
      - task: workflowsdk:{{.TASK}}
      - task: gateway:{{.TASK}}
      - task: temporal:{{.TASK}}
      # Tidy every module in go.work, not just the ones generated above:
      # tests/integration, bootstrap and tests/nats are absent from that list,
      # so nothing else would ever re-add a require dropped during generation.
      # `task tidy` ends with `go work sync`, so it replaces the bare sync that
      # used to be here.
      - task: tidy

  lint:
    desc: Lint all modules
    cmds:
      - go run ./hack/versiongroups
      - task: bootstrap:{{.TASK}}
      - task: common:{{.TASK}}
      - task: file:{{.TASK}}
      - task: inventory:{{.TASK}}
      - task: main-data:{{.TASK}}
      - task: management:{{.TASK}}
      - task: picking:{{.TASK}}
      - task: receiving:{{.TASK}}
      - task: workflow:{{.TASK}}
      - task: workflowsdk:{{.TASK}}
      - task: temporal:{{.TASK}}
      - task: integration:{{.TASK}}

  # Standalone by design, not wired into `lint`: that task runs constantly
  # during development and must not fail on unpushed WIP commits.
  lint:commits:
    desc: Check commit messages against docs/COMMIT_STANDARDS.md
    cmds:
      - ./scripts/check-commit-messages.sh {{.CLI_ARGS}}

  scan:
    desc: Scan all modules for known vulnerabilities
    cmds:
      - task: govulncheck

  govulncheck:
    desc: Run govulncheck on all modules
    cmds:
      - task: bootstrap:{{.TASK}}
      - task: common:{{.TASK}}
      - task: file:{{.TASK}}
      - task: inventory:{{.TASK}}
      - task: main-data:{{.TASK}}
      - task: management:{{.TASK}}
      - task: picking:{{.TASK}}
      - task: receiving:{{.TASK}}
      - task: workflow:{{.TASK}}
      - task: workflowsdk:{{.TASK}}
      - task: temporal:{{.TASK}}

  check:drift:
    desc: "Check ent schema/migration drift for all services (same check CI runs)"
    cmds:
      - docker compose up --wait db
      - >-
        PYCK_DATABASE_MASTER_URL=postgres://admin:12345@localhost:5432/pyck_dev?sslmode=disable
        PYCK_DATABASE_SLAVE_URL=postgres://admin:12345@localhost:5432/pyck_dev?sslmode=disable
        ./scripts/check-migrations-drift.sh

  lint:fix:
    desc: Lint all modules and fix issues
    cmds:
      - go run ./hack/versiongroups --fix
      - task: common:{{.TASK}}
      - task: file:{{.TASK}}
      - task: inventory:{{.TASK}}
      - task: main-data:{{.TASK}}
      - task: management:{{.TASK}}
      - task: picking:{{.TASK}}
      - task: receiving:{{.TASK}}
      - task: workflow:{{.TASK}}
      - task: workflowsdk:{{.TASK}}
      - task: temporal:{{.TASK}}

  format:
    desc: Format all modules
    deps:
      - task: common:{{.TASK}}
      - task: file:{{.TASK}}
      - task: inventory:{{.TASK}}
      - task: main-data:{{.TASK}}
      - task: management:{{.TASK}}
      - task: picking:{{.TASK}}
      - task: receiving:{{.TASK}}
      - task: workflow:{{.TASK}}
      - task: workflowsdk:{{.TASK}}
      - task: temporal:{{.TASK}}

  format:diff:
    desc: Show format diff for all modules
    cmds:
      - task: common:{{.TASK}}
      - task: file:{{.TASK}}
      - task: inventory:{{.TASK}}
      - task: main-data:{{.TASK}}
      - task: management:{{.TASK}}
      - task: picking:{{.TASK}}
      - task: receiving:{{.TASK}}
      - task: workflow:{{.TASK}}
      - task: workflowsdk:{{.TASK}}
      - task: temporal:{{.TASK}}

  test:
    desc: Test all modules
    cmds:
      - task: common:{{.TASK}}
      - task: file:{{.TASK}}
      - task: inventory:{{.TASK}}
      - task: main-data:{{.TASK}}
      - task: management:{{.TASK}}
      - task: picking:{{.TASK}}
      - task: receiving:{{.TASK}}
      - task: workflow:{{.TASK}}
      - task: workflowsdk:{{.TASK}}
      - task: temporal:{{.TASK}}

  test:integration:
    desc: "Run integration suites against a running stack (start it with: task up:integration)"
    cmds:
      - task: integration:test:integration:run
        vars: { CLI_ARGS: '{{.CLI_ARGS}}' }

  bruno:setup:
    desc: >-
      Provision a tenant for the Bruno collection against the running stack
      and write .bruno/environments/local.yml. Requires `task up`.
      Prints the login to use for the collection's OAuth step.
    cmds:
      - ./scripts/bruno-setup.sh

  bruno:run:
    desc: >-
      Run the Bruno collection headlessly against the running stack, setting
      up the tenant first. Pass a path to narrow the run, e.g.
      `task bruno:run -- tests/inventory`.
    cmds:
      - task: bruno:setup
      - ./scripts/bruno-run.sh {{.CLI_ARGS}}

  test:integration:up:
    desc: Boot the stack with the integration cadences (up:integration), then run the integration suites.
    cmds:
      - task: up:integration
      - task: integration:test:integration:run
        vars: { CLI_ARGS: '{{.CLI_ARGS}}' }

  test:nats:
    desc: "Run the NATS e2e suite against a running stack (start it with: task up)"
    cmds:
      - task: nats-e2e:test:nats:run
        vars: { CLI_ARGS: '{{.CLI_ARGS}}' }

  test:nats:up:
    desc: Boot the stack, then run the NATS e2e suite.
    cmds:
      - task: up
      - task: nats-e2e:test:nats:run
        vars: { CLI_ARGS: '{{.CLI_ARGS}}' }

  build:
    desc: Build all modules
    cmds:
      - task: common:{{.TASK}}
      - task: file:{{.TASK}}
      - task: inventory:{{.TASK}}
      - task: main-data:{{.TASK}}
      - task: management:{{.TASK}}
      - task: picking:{{.TASK}}
      - task: receiving:{{.TASK}}
      - task: workflow:{{.TASK}}

  install:
    desc: Install all modules
    cmds:
      - task: file:{{.TASK}}
      - task: inventory:{{.TASK}}
      - task: main-data:{{.TASK}}
      - task: management:{{.TASK}}
      - task: picking:{{.TASK}}
      - task: receiving:{{.TASK}}
      - task: workflow:{{.TASK}}

  container:up:
    desc: Run all service containers locally
    cmds:
      - task: container:{{.TASK}}

  container:debug:
    desc: Run all service debug containers locally
    cmds:
      - task: container:{{.TASK}}

  container:logs:
    desc: Follow logs of all service containers
    cmds:
      - task: container:{{.TASK}}

  container:stop:
    desc: Stop all service containers
    cmds:
      - task: container:{{.TASK}}

  # Bootstraps against the existing stack and never deletes credentials:
  # zitadel-admin-sa.json is minted once per Zitadel database and cannot be
  # regenerated, so only `init` may wipe config/keys/ (#1470).
  bootstrap-stack:
    internal: true
    cmds:
      # Keep an existing .env; never clobber local values.
      - test -f .env || cp .env.example .env
      - docker compose up --build bootstrap

  init:
    aliases: [local-setup]
    desc: "Reset local credentials and bootstrap (requires a fresh Zitadel database)"
    cmds:
      - rm -f config/keys/*.json config/keys/*.key config/keys/*.pat config/keys/*.env
      - task: bootstrap-stack

  up:
    desc: "Start all backend services (production cadences)"
    deps:
      - task: bootstrap-stack
    cmds:
      - docker compose up --build --wait {{.UP_SERVICES}}

  up:integration:
    desc: "Start all backend services with the fast integration-test cadences (config/compose/integration.yaml)"
    deps:
      - task: bootstrap-stack
    cmds:
      - docker compose -f docker-compose.yml -f config/compose/integration.yaml up --build --wait {{.UP_SERVICES}}


  ci-ready:
    desc: "Check if the backend is ready for CI"
    cmds:
      - silent: true
        defer: |-
          cat >&2 <<EOF
          {{if .EXIT_CODE}}
          ⚠️ CI readiness-check failed with exit code {{.EXIT_CODE}}.
          ⚠️ Please consult the command output above for more details.
          {{else}}
          ✅ CI readiness-check succeeded.
          {{end}}
          EOF
      - { task: generate, vars: { SILENT: true } }
      - { task: lint, vars: { SILENT: true } }
      - { task: test, vars: { SILENT: true } }
      - { task: build, vars: { SILENT: true } }
      - { task: container, vars: { SILENT: true } }

  jaeger:
    desc: "Run Jaeger locally"
    cmds:
      - silent: true
        defer: |-
          cat >&2 <<EOF
          {{if .EXIT_CODE}}
          ⚠️ Jaeger failed with exit code {{.EXIT_CODE}}.
          ⚠️ Please consult the command output above for more details.
          {{else}}
          ✅ Jaeger started successfully: http://localhost:16686/.
          {{end}}
          EOF
      - docker compose up --build --wait jaeger

  docker:
    desc: "Build and push all container images via docker buildx bake"
    cmds:
      - docker buildx bake --allow=network.host
