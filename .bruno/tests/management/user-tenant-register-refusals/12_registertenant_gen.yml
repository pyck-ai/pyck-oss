info:
  #name: Register Tenant - A decomposed admin password is refused without echoing the password
  name: Register Tenant
  type: graphql
  seq: 12

docs: |-
  The password is kept exactly as sent (no NFC normalization), and Zitadel compares the login's bytes with its hash. Keyboards send NFC, so a password whose umlaut arrives decomposed ("o" + U+0308) would register bytes the admin cannot type; it is refused, not normalized. The combining mark travels as raw UTF-8 through the gateway, which must hand the bytes to management as is.


