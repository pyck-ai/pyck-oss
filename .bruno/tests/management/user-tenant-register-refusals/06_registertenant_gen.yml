docs: |-
  Zitadel trims an org name before it stores it, so " acme" next to a live "acme" would pass the tenant name index and then collide inside Zitadel, ending as a permanent error row with the name held. registerTenant refuses surrounding whitespace in every field but the password before the name pre-flight runs.


