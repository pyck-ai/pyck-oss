docs: |-
  Zitadel holds the admin e-mail to an ASCII host-name rule and refuses an internationalised domain at user import, which runs after the org exists: the org would stay ACTIVE behind an error row holding the name. registerTenant refuses the address up front. The u-umlaut travels as a JSON \u00fc escape through the gateway.


