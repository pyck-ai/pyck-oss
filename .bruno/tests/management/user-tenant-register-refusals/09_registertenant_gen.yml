docs: |-
  Postgres refuses NUL in text, and an accepted NUL would surface the driver's "invalid byte sequence" text to an anonymous caller after the bcrypt hash was paid. The value travels as a JSON \u0000 escape through the gateway; registerTenant must answer its own refusal.


