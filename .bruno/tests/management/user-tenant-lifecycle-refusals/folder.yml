info:
  name: User - Tenant Lifecycle Refusals
  type: folder
  seq: 1

docs: |-
  The three tenant-lifecycle mutations (deleteTenant, restoreTenant, setTenantExpiry) now name their target explicitly (input.tenantId) instead of deriving it from the X-Pyck-Tenant-Id header. That is what makes this scenario possible at all: every step aims at a tenant id that is NOT the collection's own, so a working guard refuses it and a regressed guard fails an assertion instead of retiring the tenant the rest of the suite runs against.
    The Bruno PAT holds ROLE_ADMIN on its own tenant and nothing on any other, so the role gate (checked against input.tenantId, not against the caller's header) is what answers. It must answer the same way for a tenant id that exists elsewhere and for one that never existed: a refusal that distinguished the two would be a tenant-existence oracle for any authenticated caller.
    restoreTenant and setTenantExpiry additionally require the system caller, but the role gate runs first, so under this PAT "admin role required" is the expected message for all three.
    Run with the system token (BRUNO_TOKEN=<system token>) the role gate cannot refuse (the system caller passes every role check) and the mutations would reach the row lookup instead. A probe step detects the token mode and the refusal steps skip themselves under a system caller, exactly as in tests/user-management-tenant-register-refusals.
    The admitted paths (a delete that succeeds, its restore, an expiry write) need a disposable tenant and live in tests/integration/tests/tenant-lifecycle.


