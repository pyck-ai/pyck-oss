info:
  name: Cross - Custom Event Cannot Forge Entity Events
  type: folder
  seq: 1

docs: |-
  Every service's datatype cache consumes the management CRUD subjects and trusts the payload's id, so a custom "datatype delete" event on those subjects used to remove the datatype from every service's cache. Custom events now have their own subjects. This scenario creates a datatype and a typed item, sends a custom "datatype delete" event for it, checks that it is accepted, and checks that typed writes keep working, so no cache saw it. Everything is deleted at the end.


request:
  auth: inherit
