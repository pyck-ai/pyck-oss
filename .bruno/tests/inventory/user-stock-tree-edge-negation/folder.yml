info:
  name: User - Stock Tree Edge Negation
  type: folder
  seq: 1

docs: |-
  Creates a virtual source repository, a destination repository and an item, moves one unit into the destination so it carries stock, then reads the stock tree for the destination with negated edge filters. The stock has a live item and repository, so hasItem: false and hasRepository: false must return an empty tree while hasItem: true still returns the stock. The stock is moved back and everything is deleted at the end.


request:
  auth: inherit
