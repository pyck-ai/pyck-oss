info:
  name: Cross - Customer Data Type Version Re-point
  type: folder
  seq: 1

docs: |-
  Pins a customer to version 1 of a DataType slug, then creates version 2 of the same slug and re-points the customer's dataTypeID to it via updateCustomer. Verifies the entity moves to the new version while the derived slug is unchanged, and that the new version's schema validates the data.


request:
  auth: inherit
