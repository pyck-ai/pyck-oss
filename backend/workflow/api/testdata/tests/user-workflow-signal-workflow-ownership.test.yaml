---
name: "User - Workflow Signal Workflow Ownership"
description: >
  Registers a workflow with signals, re-registers it with a changed signal set
  (update, create and soft-delete paths), and verifies every live signal stays on
  the registered workflow and in its tenant. Guards the workflow-in-tenant
  check on WorkflowSignal writes (#1500) against refusing the only legitimate
  writer, registerWorkflow.
steps:
  - id: register
    name: "Register workflow with two signals"
    operation: workflow.registerWorkflow
    vars:
      input:
        name: {$fake: "SignalOwnershipWf-{{nonce}}"}
        taskQueue: "signal-ownership-queue"
        workerID: "scenario-user-workflow-signal-workflow-ownership"
        signals:
          - natsTopic: "request.reply.pyck.*.crud.inventory.items.*.create"
            temporalSignal: "itemCreated"
            temporalSignalType: "start"
            filterRule: "true"
          - natsTopic: "request.reply.pyck.*.crud.inventory.items.*.update"
            temporalSignal: "itemUpdated"
            temporalSignalType: "intermediate"
            filterRule: "true"
    tests:
      - msg: "Status is 200"
        assertions:
          - ref: res.status
            equal: 200
      - msg: "No GraphQL errors"
        assertions:
          - ref: res.body.errors
            nil: true
      - msg: "Workflow registered"
        assertions:
          - ref: res.body.data.registerWorkflow.id
            nil: false
          - ref: res.body.data.registerWorkflow.tenantID
            nil: false

  - name: "Signals belong to the registered workflow and its tenant"
    operation: workflow.getWorkflowSignals
    vars:
      where:
        workflowID: {$ref: "res[register].body.data.registerWorkflow.id"}
    tests:
      - msg: "Status is 200"
        assertions:
          - ref: res.status
            equal: 200
      - msg: "No GraphQL errors"
        assertions:
          - ref: res.body.errors
            nil: true
      - msg: "Both signals stored"
        assertions:
          - ref: res.body.data.workflowSignals.totalCount
            equal: 2
      - msg: "Every signal points at the registered workflow"
        assertions:
          - ref: res.body.data.workflowSignals.edges[].node.workflowID
            equal: {$ref: "res[register].body.data.registerWorkflow.id"}
      - msg: "Every signal is in the workflow's tenant"
        assertions:
          - ref: res.body.data.workflowSignals.edges[].node.tenantID
            equal: {$ref: "res[register].body.data.registerWorkflow.tenantID"}

  - id: reregister
    name: "Re-register with a changed signal set"
    operation: workflow.registerWorkflow
    vars:
      input:
        name: {$ref: "res[register].body.data.registerWorkflow.name"}
        taskQueue: "signal-ownership-queue"
        workerID: "scenario-user-workflow-signal-workflow-ownership"
        signals:
          - natsTopic: "request.reply.pyck.*.crud.inventory.items.*.create"
            temporalSignal: "itemCreated"
            temporalSignalType: "start"
            filterRule: "false"
          - natsTopic: "request.reply.pyck.*.crud.inventory.items.*.delete"
            temporalSignal: "itemDeleted"
            temporalSignalType: "intermediate"
            filterRule: "true"
    tests:
      - msg: "Status is 200"
        assertions:
          - ref: res.status
            equal: 200
      - msg: "No GraphQL errors"
        assertions:
          - ref: res.body.errors
            nil: true
      - msg: "Same workflow upserted"
        assertions:
          - ref: res.body.data.registerWorkflow.id
            equal: {$ref: "res[register].body.data.registerWorkflow.id"}

  - name: "Signals still belong to the registered workflow and its tenant"
    operation: workflow.getWorkflowSignals
    vars:
      where:
        workflowID: {$ref: "res[register].body.data.registerWorkflow.id"}
    tests:
      - msg: "Status is 200"
        assertions:
          - ref: res.status
            equal: 200
      - msg: "No GraphQL errors"
        assertions:
          - ref: res.body.errors
            nil: true
      - msg: "Kept signal updated, new one added, dropped one soft-deleted"
        assertions:
          - ref: res.body.data.workflowSignals.totalCount
            equal: 2
      - msg: "Every signal points at the registered workflow"
        assertions:
          - ref: res.body.data.workflowSignals.edges[].node.workflowID
            equal: {$ref: "res[register].body.data.registerWorkflow.id"}
      - msg: "Every signal is in the workflow's tenant"
        assertions:
          - ref: res.body.data.workflowSignals.edges[].node.tenantID
            equal: {$ref: "res[register].body.data.registerWorkflow.tenantID"}

  - name: "Cleanup - delete workflow"
    operation: workflow.deleteWorkflow
    vars:
      id: {$ref: "res[register].body.data.registerWorkflow.id"}
    tests:
      - msg: "Status is 200"
        assertions:
          - ref: res.status
            equal: 200
      - msg: "No GraphQL errors"
        assertions:
          - ref: res.body.errors
            nil: true
      - msg: "Deleted ID matches"
        assertions:
          - ref: res.body.data.deleteWorkflow.deletedID
            equal: {$ref: "res[register].body.data.registerWorkflow.id"}
