---
name: "Cross - Workflow Data Type Version Re-point"
description: >
  Pins a workflow to version 1 of a DataType slug, then creates version 2 of
  the same slug and re-points its dataTypeID by re-registering the workflow
  (registerWorkflow upserts on tenant + taskQueue + name, so re-registering is
  the workflow service's update path). Verifies the entity moves to the new
  version while the derived slug is unchanged.
steps:
  - id: v1
    name: "Create data type v1"
    operation: management.createDataType
    # Give the NATS create event time to propagate into the workflow service's
    # in-memory data type cache before registerWorkflow resolves the id.
    wait_after_ms: 500
    vars:
      input:
        name: "Repoint Workflow Type v1"
        slug: {$fake: "repoint-{{loremslug}}-{{nonce}}"}
        entity: "workflow"
        jsonSchema: '{"type":"object","properties":{"label":{"type":"string"}}}'
    tests:
      - msg: "Status is 200"
        assertions:
          - ref: res.status
            equal: 200
      - msg: "No GraphQL errors"
        assertions:
          - ref: res.body.errors
            nil: true
      - msg: "v1 created as version 1"
        assertions:
          - ref: res.body.data.createDataType.id
            nil: false
          - ref: res.body.data.createDataType.version
            equal: 1

  - id: createEntity
    name: "Register workflow pinned to v1"
    operation: workflow.registerWorkflow
    vars:
      input:
        name: {$fake: "RepointWf-{{nonce}}"}
        taskQueue: {$fake: "repoint-wf-queue-{{nonce}}"}
        workerID: "scenario-cross-workflow-version-repoint"
        dataTypeID: {$ref: "res[v1].body.data.createDataType.id"}
        data:
          label: "v1"
    tests:
      - msg: "Status is 200"
        assertions:
          - ref: res.status
            equal: 200
      - msg: "No GraphQL errors"
        assertions:
          - ref: res.body.errors
            nil: true
      - msg: "Entity pinned to v1"
        assertions:
          - ref: res.body.data.registerWorkflow.id
            nil: false
          - ref: res.body.data.registerWorkflow.dataTypeID
            equal: {$ref: "res[v1].body.data.createDataType.id"}
          - ref: res.body.data.registerWorkflow.dataTypeSlug
            equal: {$ref: "res[v1].body.data.createDataType.slug"}

  - id: v2
    name: "Create data type v2 (same slug)"
    operation: management.createDataType
    # The re-point resolves v2 through the same cache, so wait for its event too.
    wait_after_ms: 500
    vars:
      input:
        name: "Repoint Workflow Type v2"
        slug: {$ref: "res[v1].body.data.createDataType.slug"}
        entity: "workflow"
        jsonSchema: '{"type":"object","properties":{"label":{"type":"string"},"extra":{"type":"string"}}}'
    tests:
      - msg: "Status is 200"
        assertions:
          - ref: res.status
            equal: 200
      - msg: "No GraphQL errors"
        assertions:
          - ref: res.body.errors
            nil: true
      - msg: "v2 created as version 2 of the same slug"
        assertions:
          - ref: res.body.data.createDataType.version
            equal: 2
          - ref: res.body.data.createDataType.slug
            equal: {$ref: "res[v1].body.data.createDataType.slug"}

  - name: "Re-point workflow to v2"
    operation: workflow.registerWorkflow
    vars:
      input:
        name: {$ref: "res[createEntity].body.data.registerWorkflow.name"}
        taskQueue: {$ref: "res[createEntity].body.data.registerWorkflow.taskQueue"}
        workerID: "scenario-cross-workflow-version-repoint"
        dataTypeID: {$ref: "res[v2].body.data.createDataType.id"}
        data:
          label: "v1"
          extra: "v2"
    tests:
      - msg: "Status is 200"
        assertions:
          - ref: res.status
            equal: 200
      - msg: "No GraphQL errors"
        assertions:
          - ref: res.body.errors
            nil: true
      - msg: "Re-registration updated the same row"
        assertions:
          - ref: res.body.data.registerWorkflow.id
            equal: {$ref: "res[createEntity].body.data.registerWorkflow.id"}
      - msg: "Now pinned to v2"
        assertions:
          - ref: res.body.data.registerWorkflow.dataTypeID
            equal: {$ref: "res[v2].body.data.createDataType.id"}
      - msg: "Derived slug unchanged across versions"
        assertions:
          - ref: res.body.data.registerWorkflow.dataTypeSlug
            equal: {$ref: "res[v1].body.data.createDataType.slug"}

  - name: "Verify re-point persisted on query"
    operation: workflow.getWorkflows
    vars:
      where:
        id: {$ref: "res[createEntity].body.data.registerWorkflow.id"}
    tests:
      - msg: "Status is 200"
        assertions:
          - ref: res.status
            equal: 200
      - msg: "No GraphQL errors"
        assertions:
          - ref: res.body.errors
            nil: true
      - msg: "DataTypeID is v2 on query"
        assertions:
          - ref: res.body.data.workflows.edges[].node.dataTypeID
            equal: {$ref: "res[v2].body.data.createDataType.id"}
      - msg: "New-version data validated and persisted"
        assertions:
          - ref: res.body.data.workflows.edges[].node.data.extra
            equal: "v2"

  - name: "Cleanup - delete workflow"
    operation: workflow.deleteWorkflow
    vars:
      id: {$ref: "res[createEntity].body.data.registerWorkflow.id"}
    tests:
      - msg: "Status is 200"
        assertions:
          - ref: res.status
            equal: 200
      - msg: "No GraphQL errors"
        assertions:
          - ref: res.body.errors
            nil: true

  - name: "Cleanup - delete v2"
    operation: management.deleteDataType
    vars:
      id: {$ref: "res[v2].body.data.createDataType.id"}
    tests:
      - msg: "Status is 200"
        assertions:
          - ref: res.status
            equal: 200
      - msg: "No GraphQL errors"
        assertions:
          - ref: res.body.errors
            nil: true

  - name: "Cleanup - delete v1"
    operation: management.deleteDataType
    vars:
      id: {$ref: "res[v1].body.data.createDataType.id"}
    tests:
      - msg: "Status is 200"
        assertions:
          - ref: res.status
            equal: 200
      - msg: "No GraphQL errors"
        assertions:
          - ref: res.body.errors
            nil: true
