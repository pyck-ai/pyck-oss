---
name: "Cross - Inventory Constraint Errors Hide Schema"
description: >
  Verifies that a database constraint violation reaches the client as a generic
  message. Creates an item and a repository, then creates each again with the
  same SKU / name. Both are refused with "duplicate key: record already exists
  (SQLSTATE 23505)", not with the raw Postgres error that names the unique
  index. "duplicate key" and the SQLSTATE stay in the message because workers
  match on them. Cleans up the item and the repository.
steps:
  - id: createItem
    name: "Create item"
    operation: inventory.createInventoryItem
    vars:
      input:
        sku: {$fake: "{{sku}}-{{nonce}}"}
    tests:
      - msg: "Status is 200"
        assertions:
          - ref: res.status
            equal: 200
      - msg: "No GraphQL errors"
        assertions:
          - ref: res.body.errors
            nil: true
      - msg: "Item created"
        assertions:
          - ref: res.body.data.createInventoryItem.inventoryItem.id
            nil: false

  - name: "Create an item with the same SKU"
    operation: inventory.createInventoryItem
    vars:
      input:
        sku: {$ref: "res[createItem].body.data.createInventoryItem.inventoryItem.sku"}
    tests:
      - msg: "Status is 200"
        assertions:
          - ref: res.status
            equal: 200
      - msg: "Refused with a generic message"
        assertions:
          - ref: res.body.errors
            len: 1
          - ref: res.body.errors[0].message
            equal: "duplicate key: record already exists (SQLSTATE 23505)"

  - id: createRepo
    name: "Create repository"
    operation: inventory.createInventoryRepository
    vars:
      input:
        name: {$fake: "{{loremslug}}-{{nonce}}"}
        type: static
    tests:
      - msg: "Status is 200"
        assertions:
          - ref: res.status
            equal: 200
      - msg: "No GraphQL errors"
        assertions:
          - ref: res.body.errors
            nil: true
      - msg: "Repository created"
        assertions:
          - ref: res.body.data.createInventoryRepository.inventoryRepository.id
            nil: false

  - name: "Create a repository with the same name"
    operation: inventory.createInventoryRepository
    vars:
      input:
        name: {$ref: "res[createRepo].body.data.createInventoryRepository.inventoryRepository.name"}
        type: static
    tests:
      - msg: "Status is 200"
        assertions:
          - ref: res.status
            equal: 200
      - msg: "Refused with a generic message"
        assertions:
          - ref: res.body.errors
            len: 1
          - ref: res.body.errors[0].message
            equal: "duplicate key: record already exists (SQLSTATE 23505)"

  - name: "Delete repository"
    operation: inventory.deleteInventoryRepository
    vars:
      id: {$ref: "res[createRepo].body.data.createInventoryRepository.inventoryRepository.id"}
    tests:
      - msg: "Status is 200"
        assertions:
          - ref: res.status
            equal: 200
      - msg: "No GraphQL errors"
        assertions:
          - ref: res.body.errors
            nil: true

  - name: "Delete item"
    operation: inventory.deleteInventoryItem
    vars:
      id: {$ref: "res[createItem].body.data.createInventoryItem.inventoryItem.id"}
    tests:
      - msg: "Status is 200"
        assertions:
          - ref: res.status
            equal: 200
      - msg: "No GraphQL errors"
        assertions:
          - ref: res.body.errors
            nil: true
