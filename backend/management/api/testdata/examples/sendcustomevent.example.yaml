---
operation: SendCustomEvent
name: "Send Custom Event"
description: >
  Publishes a custom event for an entity id in the mutation's tenant. The
  workflow signal router starts or signals every workflow registered for the
  event's type and operation. Requires the WRITER role on the tenant.
vars:
  input:
    type: brunoExample
    operation: create
    payload:
      id: { $fake: uuid }
      data:
        key: value
expect:
  - msg: "Status is 200"
    assertions:
      - ref: res.status
        equal: 200
  - msg: "No GraphQL errors"
    assertions:
      - ref: res.body.errors
        nil: true
  - msg: "Event sent"
    assertions:
      - ref: res.body.data.sendCustomEvent.success
        equal: true
