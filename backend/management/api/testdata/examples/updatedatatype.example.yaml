---
operation: UpdateDataType
name: "Update Data Type"
description: >
  Updates a data type's name in place. `name` is the only mutable field on a
  DataType — every other field is immutable, so a schema change requires a new
  version via createDataType with the same slug.
vars:
  id: { $placeholder: "data type ID" }
  input:
    name: "Updated Customer Type"
expect:
  - msg: "Status is 200"
    assertions:
      - ref: res.status
        equal: 200
  - msg: "No GraphQL errors"
    assertions:
      - ref: res.body.errors
        nil: true
  - msg: "Name updated in place"
    assertions:
      - ref: res.body.data.updateDataType.id
        equal: {$ref: req.body.variables.id}
      - ref: res.body.data.updateDataType.name
        equal: "Updated Customer Type"
