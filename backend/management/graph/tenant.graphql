"""
A secret string that the server keeps exactly as sent. Unlike String, a
Password is not NFC-normalized: it is hashed and later verified byte for
byte by the identity provider, so a normalized value would be a different
password than the one the client logs in with. A field of this type may
instead refuse a value that is not already in NFC.
"""
scalar Password

input RegisterTenantInput {
  name: String!
  adminUsername: String!
  adminEmail: String!
  adminFirstName: String!
  adminLastName: String!
  """
  Password of the tenant's first admin. Hashed exactly as sent (no
  normalization, no trimming); the admin logs in with the same bytes.
  Must be in Unicode NFC (composed) form, the form keyboards send: a
  decomposed password (e.g. "o" + U+0308) is refused, since the login
  would not send those bytes. Control characters are refused too.
  """
  adminPassword: Password!
  """
  Optional metadata for the tenant.
  Synced to Zitadel org metadata and tenant.data.
  The UI template keys (remoteWebUITemplate / remoteMobileUITemplate) require
  ROLE_SYSTEM and are validated as in setTenantUITemplate.
  """
  data: Map
  """
  Optional expiry timestamp. Written directly to
  tenant.expires_at; the periodic tenant-expiry-check workflow
  soft-deletes the tenant once the timestamp is in the past.
  """
  expiresAt: Time
}

"""
Input for deleteTenant. tenantId names the tenant to retire; the
resolver enforces ROLE_ADMIN on it before any state change.
"""
input DeleteTenantInput {
  tenantId: UUID!
}

"""
Result of a manually-triggered tenant delete. Triggers the
soft-delete half of the lifecycle — the row remains in the database
and can be reactivated via restoreTenant during the grace period.
Returns an error when the tenant does not exist; idempotent on
already-deleted tenants.
"""
type DeleteTenantResponse {
  success: Boolean!
}

"""
Input for restoreTenant. tenantId names the tenant to bring back; the
resolver requires a system caller, because restore is an operator action.
"""
input RestoreTenantInput {
  tenantId: UUID!
  """
  Optional new expiry timestamp written alongside the restore. When
  omitted, the tenant's prior expires_at persists.
  """
  expiresAt: Time
}

"""
Result of a manually-triggered tenant restore. Returns an error when
the tenant does not exist; idempotent on already-active tenants.
"""
type RestoreTenantResponse {
  success: Boolean!
}

"""
Input for setTenantExpiry. tenantId names the tenant whose deadline
moves; the resolver requires a system caller, because the expiry is an
operator-imposed deadline.
"""
input SetTenantExpiryInput {
  tenantId: UUID!
  """
  New expiry timestamp; pass null to clear.
  """
  expiresAt: Time
}

"""
Result of setTenantExpiry. Returns an error when the tenant does not
exist; soft-deleted tenants are invisible to the mutation and report
the same error. Idempotent on the already-at-target-state cases
(clear against empty, set matching the current value).
"""
type SetTenantExpiryResponse {
  success: Boolean!
}

"""
Input for setTenantUITemplate. System-only (ROLE_SYSTEM / IsSystemUser).
Per platform: set a non-empty URL template (carrying {{.Slug}}/{{.Version}}
placeholders) to override the system-wide default, or clear*: true to drop the
override and revert to the default. Omit both to leave the stored value
unchanged. Setting a template and clearing it in the same call is rejected, and
the request must change at least one field. Target tenant is derived from
X-Pyck-Tenant-Id (req.MutationTenantID).
"""
input SetTenantUITemplateInput {
  """Web UI bundle URL template (remoteWebUITemplate). Omit to leave unchanged."""
  webTemplate: String
  """Drop the per-tenant web template, reverting to the system-wide default."""
  clearWebTemplate: Boolean
  """Mobile UI bundle URL template (remoteMobileUITemplate). Omit to leave unchanged."""
  mobileTemplate: String
  """Drop the per-tenant mobile template, reverting to the system-wide default."""
  clearMobileTemplate: Boolean
}

"""
Result of setTenantUITemplate. Returns an error when the tenant does not
exist. Idempotent when the provided values already match what is stored.
"""
type SetTenantUITemplateResponse {
  success: Boolean!
}
