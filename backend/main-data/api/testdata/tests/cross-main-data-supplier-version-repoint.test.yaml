---
name: "Cross - Supplier Data Type Version Re-point"
description: >
  Pins a supplier to version 1 of a DataType slug, then creates version 2 of
  the same slug and re-points its dataTypeID via the update mutation. Verifies the
  entity moves to the new version while the derived slug is unchanged.
steps:
  - id: v1
    name: "Create data type v1"
    operation: management.createDataType
    vars:
      input:
        name: "Repoint Supplier Type v1"
        slug: {$fake: "repoint-{{loremslug}}-{{nonce}}"}
        entity: "supplier"
        jsonSchema: '{"type":"object","properties":{"label":{"type":"string"}}}'
    tests:
      - msg: "Status is 200"
        assertions:
          - ref: res.status
            equal: 200
      - msg: "No GraphQL errors"
        assertions:
          - ref: res.body.errors
            nil: true
      - msg: "v1 created as version 1"
        assertions:
          - ref: res.body.data.createDataType.id
            nil: false
          - ref: res.body.data.createDataType.version
            equal: 1

  - id: createEntity
    name: "Create supplier pinned to v1"
    operation: main-data.createSupplier
    vars:
      input:
        dataTypeID: {$ref: "res[v1].body.data.createDataType.id"}
        data:
          label: "v1"
    tests:
      - msg: "Status is 200"
        assertions:
          - ref: res.status
            equal: 200
      - msg: "No GraphQL errors"
        assertions:
          - ref: res.body.errors
            nil: true
      - msg: "Entity pinned to v1"
        assertions:
          - ref: res.body.data.createSupplier.id
            nil: false
          - ref: res.body.data.createSupplier.dataTypeID
            equal: {$ref: "res[v1].body.data.createDataType.id"}
          - ref: res.body.data.createSupplier.dataTypeSlug
            equal: {$ref: "res[v1].body.data.createDataType.slug"}

  - id: v2
    name: "Create data type v2 (same slug)"
    operation: management.createDataType
    vars:
      input:
        name: "Repoint Supplier Type v2"
        slug: {$ref: "res[v1].body.data.createDataType.slug"}
        entity: "supplier"
        jsonSchema: '{"type":"object","properties":{"label":{"type":"string"},"extra":{"type":"string"}}}'
    tests:
      - msg: "Status is 200"
        assertions:
          - ref: res.status
            equal: 200
      - msg: "No GraphQL errors"
        assertions:
          - ref: res.body.errors
            nil: true
      - msg: "v2 created as version 2 of the same slug"
        assertions:
          - ref: res.body.data.createDataType.version
            equal: 2
          - ref: res.body.data.createDataType.slug
            equal: {$ref: "res[v1].body.data.createDataType.slug"}

  - name: "Re-point supplier to v2"
    operation: main-data.updateSupplier
    vars:
      id: {$ref: "res[createEntity].body.data.createSupplier.id"}
      input:
        dataTypeID: {$ref: "res[v2].body.data.createDataType.id"}
        data:
          label: "v1"
          extra: "v2"
    tests:
      - msg: "Status is 200"
        assertions:
          - ref: res.status
            equal: 200
      - msg: "No GraphQL errors"
        assertions:
          - ref: res.body.errors
            nil: true
      - msg: "Now pinned to v2"
        assertions:
          - ref: res.body.data.updateSupplier.dataTypeID
            equal: {$ref: "res[v2].body.data.createDataType.id"}
      - msg: "Derived slug unchanged across versions"
        assertions:
          - ref: res.body.data.updateSupplier.dataTypeSlug
            equal: {$ref: "res[v1].body.data.createDataType.slug"}

  - name: "Verify re-point persisted on query"
    operation: main-data.getSuppliers
    vars:
      where:
        id: {$ref: "res[createEntity].body.data.createSupplier.id"}
    tests:
      - msg: "Status is 200"
        assertions:
          - ref: res.status
            equal: 200
      - msg: "No GraphQL errors"
        assertions:
          - ref: res.body.errors
            nil: true
      - msg: "DataTypeID is v2 on query"
        assertions:
          - ref: res.body.data.suppliers.edges[].node.dataTypeID
            equal: {$ref: "res[v2].body.data.createDataType.id"}
      - msg: "New-version data validated and persisted"
        assertions:
          - ref: res.body.data.suppliers.edges[].node.data.extra
            equal: "v2"

  - name: "Cleanup - delete supplier"
    operation: main-data.deleteSupplier
    vars:
      id: {$ref: "res[createEntity].body.data.createSupplier.id"}
    tests:
      - msg: "Status is 200"
        assertions:
          - ref: res.status
            equal: 200
      - msg: "No GraphQL errors"
        assertions:
          - ref: res.body.errors
            nil: true

  - name: "Cleanup - delete v2"
    operation: management.deleteDataType
    vars:
      id: {$ref: "res[v2].body.data.createDataType.id"}
    tests:
      - msg: "Status is 200"
        assertions:
          - ref: res.status
            equal: 200
      - msg: "No GraphQL errors"
        assertions:
          - ref: res.body.errors
            nil: true

  - name: "Cleanup - delete v1"
    operation: management.deleteDataType
    vars:
      id: {$ref: "res[v1].body.data.createDataType.id"}
    tests:
      - msg: "Status is 200"
        assertions:
          - ref: res.status
            equal: 200
      - msg: "No GraphQL errors"
        assertions:
          - ref: res.body.errors
            nil: true
