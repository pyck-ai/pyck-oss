# Exercises the federated Customer.file relation, which is contributed and
# resolved by the file subgraph. apigen cannot auto-generate this: `file` is an
# entity edge (skipped) and lives on another subgraph, so the selection is only
# valid against the composed supergraph. brunogen runs it through the gateway.
# See file/graph/filetypes.graphql.
query GetCustomerWithFile($where: CustomerWhereInput) {
  customers(where: $where) {
    edges {
      node {
        id
        tenantID
        file {
          id
          tenantID
          refid
        }
      }
    }
  }
}
