services:
  file:
    container_name: pyck-file
    build:
      context: ../../../
      dockerfile: ./backend/Dockerfile
      args:
        - SERVICE_NAME=file
        - SERVICE_PORT=8088
      network: host
    restart: always
    # Must exceed pre-drain delay + HTTP drain timeout + resource teardown
    # (outbox flush, NATS drain, tracer flush) so SIGKILL never interrupts a
    # graceful shutdown.
    stop_grace_period: 30s
    env_file:
      - path: ../../../config/keys/bootstrap.env
      - path: ../../../.env
      - path: ../../../.env.local
        required: false
    volumes:
      - ./../../../:/src:ro,z
      - ./../../../backend/file/ent/migrate/migrations/:/app/file/ent/migrate/migrations/:z
      - ./../../keys/:/data/keys/:ro,z
    ports:
      - "7088:7088"
      - "8088:8088"
    depends_on:
      gateway: { condition: service_healthy }
      management: { condition: service_healthy }
    healthcheck:
      # Readiness endpoint: reports 503 while the service drains, unlike a
      # bare TCP check which passes as long as the listener is bound.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8088/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 64M
